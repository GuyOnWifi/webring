# The self-healing data loop. On a schedule (and on merge), re-scrapes every
# member, prunes dead sites, refreshes the planet feed, and commits the data
# back so failure counts persist. That committed public/*.json + feed is the
# product — member sites consume it directly. No site host / Pages deploy.
name: refresh
on:
  schedule:
    - cron: "0 */6 * * *" # every 6h (free on public repos)
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping runs racing on the data commit.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Scrape members + rebuild index/feed
        run: npm run scrape

      - name: Commit refreshed data
        run: |
          git config user.name "webring-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/index.json public/feed.json public/feed.xml public/members.opml
          git commit -m "chore: rebuild index [skip ci]" || echo "no changes"
          git push || echo "nothing to push"

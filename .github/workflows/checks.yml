# Code-quality checks on every PR. Safe to run the PR's own code here: `pull_request`
# (not `pull_request_target`) gives fork PRs a READ-ONLY token and no secrets, so there
# is nothing for malicious PR code to steal or push. The privileged bits (verify, comment,
# auto-merge) live in ci.yml, which never executes PR code. Keep that split.
name: checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: checks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate member JSON
        run: npm run validate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (compile smoke test)
        env:
          NEXT_PUBLIC_BASE_PATH: /webring
        run: npx next build

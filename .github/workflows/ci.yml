# Runs on every PR. Validates the member file, verifies domain ownership, comments the
# result, and auto-merges members-only PRs. No human maintainer in the loop.
#
# SECURITY: this uses pull_request_target, so it runs with a write-scoped token and repo
# secrets. It MUST NOT execute any code from the PR. We check out the trusted BASE branch
# for all scripts, pull in ONLY the PR's members/*.json (data, parsed not executed), and
# never run `npm ci`/lint/build on PR code. validate.mjs + verify.mjs use only Node
# built-ins, so there is nothing to install and no postinstall hook can run.
name: ci
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Trusted checkout: the BASE branch. Note there is NO `ref: head.sha` here, so the
      # scripts we run are ours, not the PR author's.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bring in the PR as DATA only. Get the changed files (+ their status) from the API,
      # then check out solely the members/ path from the PR head. The `-- members/`
      # pathspec confines the write to that directory; scripts/, package.json, and
      # .github/ stay at the trusted base version.
      - name: Pull PR member data
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr='${{ github.event.pull_request.number }}'
          files_json=$(gh api "repos/${{ github.repository }}/pulls/$pr/files" --paginate)
          echo "files=$(echo "$files_json" | jq -r '.[].filename' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          # Auto-merge ONLY pure additions of member files. Editing, deleting, or renaming
          # an existing entry (or touching any non-member file) drops to human review, so a
          # PR can't grief someone else's file.
          echo "safe=$(echo "$files_json" | jq -r 'length > 0 and all(.[]; .status == "added" and (.filename | test("^members/[^/]+\\.json$")))')" >> "$GITHUB_OUTPUT"
          git fetch origin "pull/$pr/head:pr" --depth=1
          git checkout pr -- members/

      # Trusted scripts (base branch), run against the PR's member data. No deps needed.
      - name: Validate member JSON
        env:
          PR_COMMENT_FILE: pr-comment.md
        run: node scripts/validate.mjs

      - name: Verify domain ownership (+ draft suggestion)
        id: verify
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          PR_COMMENT_FILE: pr-comment.md
        run: node scripts/verify.mjs

      # Always post the bot's findings on the PR thread, pass or fail. On failure the
      # verify step exits non-zero, so auto-merge is skipped, but this still runs and
      # tells the submitter exactly what to fix (with a ready-to-paste suggestion).
      - name: Comment on PR (sticky)
        if: always() && hashFiles('pr-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/sticky-comment.sh

      # Don't merge immediately. Mark ready (only if verify passed + additions-only) so the
      # delayed automerge sweep picks it up after the review window, unless a maintainer
      # adds a "hold" label. Clear the mark if anything failed.
      - name: Mark ready to merge
        if: steps.diff.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create ready-to-merge --color 0e8a16 --description "passed checks; merges after the review window" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label ready-to-merge
      - name: Clear ready mark on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label ready-to-merge || true

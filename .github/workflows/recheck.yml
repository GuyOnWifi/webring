# Lets anyone re-trigger the join check by commenting "/recheck" on a PR. Handy after a
# member fixes their site, since verify.mjs fetches the site live each run. Same trust
# model as ci.yml: runs base-branch scripts against the PR's members/*.json data only,
# never executes PR code.
name: recheck
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  recheck:
    # Only on PR comments (not issues) that contain the /recheck command.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/recheck') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # trusted base branch, no PR code
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: React to the command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes || true

      - name: Pull PR member data
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr='${{ github.event.issue.number }}'
          files_json=$(gh api "repos/${{ github.repository }}/pulls/$pr/files" --paginate)
          echo "files=$(echo "$files_json" | jq -r '.[].filename' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          # Ownership + dedup guard, identical to ci.yml: the sole change must be an added
          # members/<author-login>.json.
          author=$(gh pr view "$pr" --json author --jq '.author.login' | tr '[:upper:]' '[:lower:]')
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "safe=$(echo "$files_json" | jq --arg f "members/${author}.json" -r 'length > 0 and all(.[]; .filename == $f and .status == "added")')" >> "$GITHUB_OUTPUT"
          git fetch origin "pull/$pr/head:pr" --depth=1
          git checkout pr -- members/

      - name: Validate member JSON
        env:
          PR_COMMENT_FILE: pr-comment.md
        run: node scripts/validate.mjs

      - name: Verify domain ownership (+ draft suggestion)
        id: verify
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
          PR_COMMENT_FILE: pr-comment.md
          PR_SAFE: ${{ steps.diff.outputs.safe }}
          PR_AUTHOR: ${{ steps.diff.outputs.author }}
        run: node scripts/verify.mjs

      - name: Comment on PR (sticky)
        if: always() && hashFiles('pr-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: bash scripts/sticky-comment.sh

      # Mark ready (verify passed + additions-only) for the delayed automerge sweep;
      # clear the mark on failure. Same net as ci.yml.
      - name: Mark ready to merge
        if: steps.diff.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh label create ready-to-merge --color 0e8a16 --description "passed checks; merges after the review window" --force >/dev/null 2>&1 || true
          # Same as ci.yml: guarantee the brake exists for PRs on the merge track.
          gh label create hold --color b60205 --description "maintainer objection; blocks auto-merge" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label ready-to-merge
      # Clear whenever this run didn't earn the mark (failed, or no longer additions-only).
      - name: Clear ready mark
        if: always() && (failure() || steps.diff.outputs.safe != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
        run: gh pr edit "$PR" --remove-label ready-to-merge || true
